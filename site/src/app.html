<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The chosen theme, applied before anything is drawn so the page
		     never flashes in the other one. The header's picker sets it. -->
		<script>
			try {
				var t = localStorage.getItem('politicompass.theme.v1');
				if (t && t !== 'auto') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
