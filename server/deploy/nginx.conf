# nginx in front of the Politiskel server. TLS certificates from certbot
# (`sudo certbot --nginx -d politiskel.example.org` fills the two paths).
#
# The server itself sets the security headers (CSP and the others); nginx
# only terminates HTTPS and passes requests on.

server {
    listen 80;
    listen [::]:80;
    server_name politiskel.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name politiskel.example.org;

    ssl_certificate     /etc/letsencrypt/live/politiskel.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/politiskel.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API accepts bodies up to 64 KB; a little more here, so the server
    # is the one that answers.
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # The Host the browser asked for: the server checks writes against it.
        proxy_set_header Host $host;
        # Appends the client's address: the server reads the last entry.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
